[package]
name = "zapd"
version.workspace = true
license.workspace = true
edition = "2024"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
rand = "0.8"
axum = { version = "0.8.4", features = ["macros", "multipart", "ws"] }
russh = { version = "0.63", default-features = false, features = [
    "ring",
    "rsa",
] }
futures-util = "0.3"
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.6.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
# 云存储：统一对象存储访问层（S3 / 阿里云 OSS / 腾讯云 COS / S3 兼容协议）
opendal = { version = "0.59", default-features = false, features = [
    "services-s3",
    "services-oss",
    "services-cos",
    "http-transport-reqwest",
    "executors-tokio",
    "layers-retry",
    "layers-timeout",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

serde = { version = "1.0.146", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.*"
sqlx = { version = "0.8", features = [ "runtime-tokio", "json", "sqlite","derive","time" ] }
hyper = { version = "1.7.0", features = ["full"] }
hyper-util = { version = "0.1.16", features = ["full"] }
tokio-rustls = "0.26"
tower-service = "0.3.3"

ip-discovery = { version = "0.5", features = ["tokio"] }
getrandom = "0.2"
bytes = "1.10"
hex = "0.4"
rust-embed = "8.7.2"
mime_guess = "2.0.5"
rcgen = "0.13"
# ACME 客户端（Let's Encrypt）：异步 API，HTTP 客户端走 hyper-rustls（rustls + ring）。
#
# 注意两点，否则 OpenSSL / aws-lc-rs 会被重新拖进依赖树：
#   - 必须 default-features = false：默认 feature 是 aws-lc-rs（需要 cmake / C 编译器）；
#   - `rcgen` feature 让 instant-acme 自己按需生成 CSR 与私钥 PEM（内部 rcgen 0.14，
#     与面板自签名用的 rcgen 0.13 互不干扰）。
instant-acme = { version = "0.8", default-features = false, features = [
    "hyper-rustls",
    "ring",
    "rcgen",
] }
# DNS 服务商 API 探针 / Google DNS-over-HTTPS 传播检测用。
# 同理必须 default-features = false：默认 `default-tls` 会引入 native-tls → OpenSSL。
# `query` / `form` 在 reqwest 里是可选 feature，DNS 服务商 API 要用 GET 查询串与表单 POST。
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "query",
    "form",
    "rustls",
] }
async-trait = "0.1"
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
rustls-pemfile = "2"
time = "0.3"
local-ip-address = "0.6.5"
bcrypt = "0.17.1"
jsonwebtoken = "9.3.1"
axum-extra = { version = "0.10.1", features = ["typed-header"] }
thiserror = "2.0.16"
sysinfo = { version = "0.37.0", default-features = false,features=[ "default"] }
systemstat = "0.2.5"
humantime = "2.3.0"
chrono = "0.4.42"
human_bytes = { version = "0.4.3", default-features = false }
tokio-cron-scheduler = "0.14.0"
once_cell = "1.21.3"
clap = { version = "4.5.49", features = ["derive"] }
zap-proto = { path = "../zap-proto" }
zap-crypto = { path = "../zap-crypto" }
x509-parser = "0.18.1"
ureq = "2.12"
tar = "0.4"
flate2 = "1.0"
# 国际化域名（中文域名）转 punycode，用于站点域名归一化与判重
idna = "1.1"
# 「文档」菜单的 Markdown 渲染（GET /api/docs/:name）
# 默认 features 已开启 html —— 它负责把 Parser 事件转成 HTML 字符串
# （依赖 pulldown-cmark-escape），缺它 `pulldown_cmark::html::push_html` 编译失败。
pulldown-cmark = "0.12"

# 构建期注入版本元信息（build date / git / rustc），见 build.rs
# features 说明：
#   build  → VERGEN_BUILD_DATE / VERGEN_BUILD_TIMESTAMP
#   cargo  → VERGEN_CARGO_TARGET_TRIPLE / VERGEN_CARGO_PROFILE ...
#   git+gitcl → VERGEN_GIT_*（gitcl 走本机 git 命令，无需 libgit2）
#   rustc  → VERGEN_RUSTC_SEMVER / VERGEN_RUSTC_CHANNEL ...
[build-dependencies]
vergen = { version = "8", default-features = false, features = [
    "build",
    "cargo",
    "git",
    "gitcl",
    "rustc",
] }
anyhow = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
