[package]
name = "zapd"
version.workspace = true
license.workspace = true
edition = "2024"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
rand = "0.8"
axum = { version = "0.8.4", features = ["macros", "multipart", "ws"] }
russh = { version = "0.63", default-features = false, features = [
    "ring",
    "rsa",
] }
futures-util = "0.3"
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.6.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
opendal = { version = "0.59", default-features = false, features = [
    "services-s3",
    "services-oss",
    "services-cos",
    "http-transport-reqwest",
    "executors-tokio",
    "layers-retry",
    "layers-timeout",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

serde = { version = "1.0.146", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.*"
sqlx = { version = "0.8", features = [ "runtime-tokio", "json", "sqlite","derive","time" ] }
hyper = { version = "1.7.0", features = ["full"] }
hyper-util = { version = "0.1.16", features = ["full"] }
tokio-rustls = "0.26"
tower-service = "0.3.3"

ip-discovery = { version = "0.5", features = ["tokio"] }
getrandom = "0.2"
bytes = "1.10"
hex = "0.4"
rust-embed = "8.7.2"
mime_guess = "2.0.5"
rcgen = "0.13"
# without OpenSSL
instant-acme = { version = "0.8", default-features = false, features = [
    "hyper-rustls",
    "ring",
    "rcgen",
] }
# without OpenSSL
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "query",
    "form",
    "rustls",
] }
async-trait = "0.1"
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
rustls-pemfile = "2"
time = "0.3"
local-ip-address = "0.6.5"
bcrypt = "0.17.1"
jsonwebtoken = "9.3.1"
axum-extra = { version = "0.10.1", features = ["typed-header"] }
thiserror = "2.0.16"
sysinfo = { version = "0.37.0", default-features = false,features=[ "default"] }
systemstat = "0.2.5"
humantime = "2.3.0"
chrono = "0.4.42"
human_bytes = { version = "0.4.3", default-features = false }
tokio-cron-scheduler = "0.14.0"
once_cell = "1.21.3"
clap = { version = "4.5.49", features = ["derive"] }
zap-proto = { path = "../zap-proto" }
zap-crypto = { path = "../zap-crypto" }
x509-parser = "0.18.1"
ureq = "2.12"
tar = "0.4"
flate2 = "1.0"
# punycode
idna = "1.1"
# markdown
pulldown-cmark = "0.12"

ed25519-dalek = { version = "3", optional = true }


[build-dependencies]
vergen = { version = "8", default-features = false, features = [
    "build",
    "cargo",
    "git",
    "gitcl",
    "rustc",
] }
anyhow = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[features]
commercial = ["dep:ed25519-dalek"]
