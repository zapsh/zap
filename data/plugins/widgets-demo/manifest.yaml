name: widgets-demo
title: 控件示例插件
scope: site
# placement 决定前端入口出现的槽位；这里挂在站点详情页「插件」Tab
ui:
  placement: site.detail
  label: 控件示例
  icon: Box
  tab: 应用
# 这里把插件支持的全部 option 控件类型都演示一遍
options:
  - name: TEXT
    label: 文本
    type: string
    required: true
    placeholder: 请输入任意文本
    desc: 普通单行文本输入
  - name: NUM
    label: 数字
    type: number
    default: "1"
    desc: 数字输入（回传字符串）
  - name: FLAG
    label: 开关
    type: bool
    default: "false"
    desc: 布尔开关，回传 true/false
  - name: SINGLE
    label: 单选
    type: select
    choices:
      - label: 选项 A
        value: a
      - label: 选项 B
        value: b
      - label: 选项 C
        value: c
    default: a
    desc: 下拉单选，回传选中的 value
  - name: MULTI
    label: 多选
    type: multiselect
    choices:
      - label: 选项 X
        value: x
      - label: 选项 Y
        value: y
      - label: 选项 Z
        value: z
    desc: 下拉多选，回传以空格连接的 value 串
  - name: TARGET
    label: 目标目录
    type: dir
    default: ""
    desc: 目录选择器；回传绝对路径（空 = 站点根），插件内直接当作目标路径使用，无需再拼接站点根
  - name: SRC
    label: 源文件
    type: file
    desc: 单文件选择器；回传绝对路径
  - name: SRCS
    label: 源文件清单
    type: files
    desc: 多文件选择器；回传以空格连接的绝对路径串
actions:
  run: 运行示例
