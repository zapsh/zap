[package]
name = "zapctl"
version.workspace = true
license.workspace = true
edition = "2024"

[dependencies]
clap = { version = "4.5.47", features = ["derive"] }
clap_derive = "4.5.47"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
bcrypt = "0.17.1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
rpassword = "7"
chrono = "0.4"
zap-crypto = { path = "../zap-crypto" }
