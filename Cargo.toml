[workspace]
resolver = "3"
members = ["zapd","zapctl","zap-proto","zapexec","zapupgrade","zap-crypto","zap-platform"]

[workspace.package]
version = "1.5.8"
license = "AGPL-3.0"



[profile.release]
opt-level = 2        
debug = false
strip = true
panic = "unwind"       # abort unwind
incremental = false


[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true
codegen-units = 256


