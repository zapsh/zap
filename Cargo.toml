[workspace]
resolver = "3"
members = ["zapd","zapctl","zap-proto","zapexec","zapupgrade","zap-crypto"]

[workspace.package]
version = "1.0.11"
license = "GPL-3.0-or-later"


[profile.dev]
debug = "line-tables-only"
incremental = true 


[profile.dev.package."*"]
opt-level = 1


[profile.release]
opt-level = 2        
debug = false
strip = true
panic = "unwind"       # abort unwind
incremental = false

