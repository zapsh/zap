server {
    # 不带 default_server:面板的默认站点(nginx.default_vhost)也写 default_server,
    # 两处都声明会让 nginx -t 直接 [emerg] duplicate default server 起不来。
    # 这里留空,缺 default 时 nginx 自动把本文件的第一个 server 当默认。
    listen       80;
    server_name  _;
    access_log   off;
    
    location / {
        root   html;
        index  index.html index.htm;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   html;
    }
}


server {
    listen       80;
    server_name  localhost;
    access_log   off;

    location /nginx_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }
}