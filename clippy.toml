# 安全加固：禁止在 routers/** 直接使用 std::fs 的阻塞 I/O 类型。
# tokio worker 中做阻塞 fs 会卡住整个异步线程池（见安全审计 #7，async 处理器内同步阻塞 I/O，High）。
# 应改用 tokio::fs（在 async 路径中）或 tokio::task::spawn_blocking（把 std::fs 挪到阻塞线程）。
#
# 注意：故意不列入 `std::fs::Metadata` / `std::fs::Permissions` ——
# 前者是 tokio::fs 各函数的返回类型，后者是 tokio::fs::set_permissions 设置权限位（from_mode）所必需的，
# 二者无法用 tokio 替代，且本身不是阻塞调用。
disallowed-types = [
  "std::fs::File",
  "std::fs::OpenOptions",
  "std::fs::ReadDir",
  "std::fs::DirEntry",
  "std::fs::FileType",
]
