name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  PROJECT_NAME: zap

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 内置 AppStore 源是 submodule，默认不检出；发行包必须带上它（data/appstore/repos/appstore），
      # 否则装好的面板没有内置应用。地址 / 分支与 ci.yml、data/appstore/repos.yaml 保持一致，
      # --depth 1 会带上一个真实的 .git，目标机首次「更新」走 fetch 而不是全量 clone。
      - name: Clone builtin appstore repo
        run: |
          mkdir -p data/appstore/repos
          rm -rf data/appstore/repos/appstore
          git clone --depth 1 --branch main https://github.com/zapsh/appstore.git data/appstore/repos/appstore

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (pinned)
        run: cargo install cross --version 0.2.5 --locked

      # 版本号唯一来源：根 Cargo.toml 的 [workspace.package].version（与 build.sh 一致）。
      # 打 tag 发布时顺带核对 tag 与 Cargo.toml 是否一致，避免发错版本。
      - name: Resolve version
        id: version
        run: |
          version="$(awk -F'"' '/^\[workspace\.package\]/{f=1} f&&/^version/{print $2; exit}' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "error: failed to parse workspace version from Cargo.toml" >&2
            exit 1
          fi
          tag="${GITHUB_REF#refs/tags/}"
          if [ "$tag" != "$GITHUB_REF" ] && [ "${tag#v}" != "$version" ]; then
            echo "warning: tag ${tag} does not match Cargo.toml version ${version}" >&2
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 前端必须先在 cargo build 之前构建：zapd 通过 rust-embed 在编译期把 ../web/dist 打进二进制。
      # 否则 GitHub Release 的二进制只会内嵌陈旧/空的 web/dist（与 build.sh 行为一致）。
      - name: Build web frontend
        working-directory: web
        env:
          ZAP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm ci
          npm run build:prod

      - name: Build release binaries
        run: cross build --release --target ${{ matrix.target }} --locked

      # 按 build.sh 的完整布局打包（zap/ 目录：四个二进制 + scripts + data），
      # 产物名 zap-v<version>-linux-<arch>.tar.gz，与 scripts/install.sh 期望一致。
      #
      # package.sh 会先 cd 到 <outdir>/.pkg 再 tar（脚本内已把 outdir 归一成绝对路径，
      # 传相对路径也不会再失败），这里仍显式传 ${{ github.workspace }}/dist 更直观。
      - name: Package artifact (build.sh layout)
        env:
          # package.sh 里 VERSION 优先于 GitHub 注入的 GITHUB_REF_NAME，
          # 所以传 Cargo.toml 解析出的版本号即可，workflow_dispatch 也能得到正确包名。
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x scripts/release/package.sh
          bash scripts/release/package.sh package-full "${{ matrix.arch }}" "${{ matrix.target }}" "target/${{ matrix.target }}/release" "${{ github.workspace }}/dist"

      - name: Upload tar.gz
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    # 只有 tag 推送才建 GitHub Release；workflow_dispatch 仅用于验证构建，产物留在 artifacts 里
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist

      # download-artifact 会把每个 matrix 产物放进各自子目录，先拍平到 dist/ 下。
      - name: Flatten artifacts
        run: |
          find dist -type f -name '*.tar.gz' -exec mv -t dist {} +
          find dist -mindepth 1 -type d -empty -delete

      - name: Generate sha256
        run: |
          chmod +x scripts/release/package.sh
          bash scripts/release/package.sh checksum "dist"

      # secrets 上下文不能用在 if: 里；密钥未配置时 package.sh 会自行跳过签名。
      # 注意：SSH_PRIVATE_KEY 需配置为 Repository secret（环境 secret 需 job 声明 environment 才可见）。
      - name: Optional sign shasum files (SSH)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
        run: |
          chmod +x scripts/release/package.sh
          bash scripts/release/package.sh sign "dist"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.sha256.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
