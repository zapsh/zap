name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  PROJECT_NAME: zap

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 内置 AppStore 源是 submodule，默认不检出；发行包必须带上它（data/appstore/repos/appstore），
      # 否则装好的面板没有内置应用。地址 / 分支与 ci.yml、data/appstore/repos.yaml 保持一致，
      # --depth 1 会带上一个真实的 .git，目标机首次「更新」走 fetch 而不是全量 clone。
      - name: Clone builtin appstore repo
        run: |
          mkdir -p data/appstore/repos
          rm -rf data/appstore/repos/appstore
          git clone --depth 1 --branch main https://github.com/zapsh/appstore.git data/appstore/repos/appstore

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (pinned)
        run: cargo install cross --version 0.2.5 --locked

      # 版本号唯一来源：根 Cargo.toml 的 [workspace.package].version（与 build.sh 一致）。
      # 打 tag 发布时顺带核对 tag 与 Cargo.toml 是否一致，避免发错版本。
      - name: Resolve version
        id: version
        run: |
          version="$(awk -F'"' '/^\[workspace\.package\]/{f=1} f&&/^version/{print $2; exit}' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "error: failed to parse workspace version from Cargo.toml" >&2
            exit 1
          fi
          tag="${GITHUB_REF#refs/tags/}"
          if [ "$tag" != "$GITHUB_REF" ] && [ "${tag#v}" != "$version" ]; then
            echo "warning: tag ${tag} does not match Cargo.toml version ${version}" >&2
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 前端必须先在 cargo build 之前构建：zapd 通过 rust-embed 在编译期把 ../web/dist 打进二进制。
      # 否则 GitHub Release 的二进制只会内嵌陈旧/空的 web/dist（与 build.sh 行为一致）。
      - name: Build web frontend
        working-directory: web
        env:
          ZAP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm ci
          npm run build:prod

      - name: Build release binaries
        run: cross build --release --target ${{ matrix.target }} --locked

      # 按 build.sh 的完整布局打包（zap/ 目录：四个二进制 + scripts + data），
      # 产物名 zap-v<version>-linux-<arch>.tar.gz，与 scripts/install.sh 期望一致。
      #
      # package.sh 会先 cd 到 <outdir>/.pkg 再 tar（脚本内已把 outdir 归一成绝对路径，
      # 传相对路径也不会再失败），这里仍显式传 ${{ github.workspace }}/dist 更直观。
      - name: Package artifact (build.sh layout)
        env:
          # package.sh 里 VERSION 优先于 GitHub 注入的 GITHUB_REF_NAME，
          # 所以传 Cargo.toml 解析出的版本号即可，workflow_dispatch 也能得到正确包名。
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x scripts/release/package.sh
          bash scripts/release/package.sh package-full "${{ matrix.arch }}" "${{ matrix.target }}" "target/${{ matrix.target }}/release" "${{ github.workspace }}/dist"

      - name: Upload tar.gz
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    # 只有 tag 推送才建 GitHub Release；workflow_dispatch 仅用于验证构建，产物留在 artifacts 里
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 版本号唯一来源：根 Cargo.toml 的 [workspace.package].version。
      # release job 自己解析一份，供 latest.txt / latest 别名资产使用
      # （也修掉此前「Add latest alias assets」引用 steps.version 时的空值问题）。
      - name: Resolve version
        id: version
        run: |
          version="$(awk -F'"' '/^\[workspace\.package\]/{f=1} f&&/^version/{print $2; exit}' Cargo.toml)"
          [ -n "$version" ] || { echo "error: failed to parse workspace version from Cargo.toml"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist

      # download-artifact 会把每个 matrix 产物放进各自子目录，先拍平到 dist/ 下。
      - name: Flatten artifacts
        run: |
          find dist -type f -name '*.tar.gz' -exec mv -t dist {} +
          find dist -mindepth 1 -type d -empty -delete

      - name: Generate sha256
        run: |
          chmod +x scripts/release/package.sh
          bash scripts/release/package.sh checksum "dist"

      # 注：原先还有一步用 SSH_PRIVATE_KEY 给 .sha256 签 SSH 签名（.sha256.sig），
      # 该文件没有任何消费方（zapd/zapupgrade 不校验它），属于无用的第二把私钥，
      # 已整体移除，避免把 SSH 私钥引入发布流水线。
      # Ed25519 发布签名（{pkg}.sig，hex 分离签名）：zapd/zapupgrade 用编译期 pin 的
      # 公钥验证包体，这是自动更新信任根的关键一层（sha256 可被中间人静默跳过）。
      # 私钥为 Repository secret ZAP_SIGN_KEY（PKCS#8 Ed25519 PEM 文本，与 build.sh
      # 本地发版同一把）。未配置时跳过，目标机需开启 allow_insecure_update 才能安装。
      - name: Sign packages (Ed25519)
        env:
          ZAP_SIGN_KEY: ${{ secrets.ZAP_SIGN_KEY }}
        run: |
          if [ -z "$ZAP_SIGN_KEY" ]; then
            echo "info: ZAP_SIGN_KEY not set; skip package signing (updaters need allow_insecure_update)."
            exit 0
          fi
          keyfile=$(mktemp)
          printf '%s\n' "$ZAP_SIGN_KEY" > "$keyfile"
          chmod 600 "$keyfile"
          # 确认是 Ed25519 私钥（算法不符时立刻失败，而不是产出无效签名）
          openssl pkey -in "$keyfile" -noout -text 2>/dev/null | grep -q "ED25519" \
            || { echo "error: ZAP_SIGN_KEY is not an Ed25519 private key"; rm -f "$keyfile"; exit 1; }
          for pkg in dist/*.tar.gz; do
            openssl pkeyutl -sign -inkey "$keyfile" -rawin -in "$pkg" -out "$pkg.sig.bin" \
              || { echo "error: signing failed: $pkg"; rm -f "$keyfile"; exit 1; }
            od -An -tx1 -v "$pkg.sig.bin" | tr -d ' \n' > "$pkg.sig"
            rm -f "$pkg.sig.bin"
            echo "signed: $pkg.sig"
          done
          rm -f "$keyfile"

      # 固定名「latest」别名资源：zap-linux-<arch>.tar.gz。installer 境外通道走
      # releases/latest/download 重定向直下最新包，无需先查版本号 / latest.txt / API。
      # 与版本化资源内容完全一致，只是名字不含版本，发版 CI 顺手复制一份。
      - name: Add latest alias assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd dist
          for a in amd64 arm64; do
            src="zap-v${VERSION}-linux-${a}.tar.gz"
            [ -f "$src" ] && cp "$src" "zap-linux-${a}.tar.gz"
          done
          ls -1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 镜像发布（统一收口：原 release.sh --sync / --tag 的 zapfile 动作全部搬进 CI）──
      # 这样「打 tag 即可」：构建完成后自动把包体 + 校验/签名 + 安装脚本同步到
      # COS(mirrors.zap.cn) 与 Cloudflare R2(mirrors.zap.sh)，并发布 latest.txt。
      # 不再需要本地手跑 release.sh --sync。
      - name: Install zapfile
        run: |
          curl -fsSL https://mirrors.zap.sh/zapfile/zapfile-linux-amd64 -o /usr/local/bin/zapfile \
            || { echo "zapfile install failed"; exit 1; }
          chmod +x /usr/local/bin/zapfile
          zapfile version

      - name: Mirror to COS + Cloudflare (releases + latest.txt + scripts)
        env:
          COS_ID: ${{ secrets.COS_ID }}
          COS_KEY: ${{ secrets.COS_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT: ${{ secrets.AWS_ENDPOINT }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
          AWS_R2_TOKEN: ${{ secrets.AWS_R2_TOKEN }}
        run: |
          set -euo pipefail
          ver="${{ steps.version.outputs.version }}"
          echo "mirroring release assets for v${ver} ..."
          # 包体 + .sha256 + .sig + latest 别名（zap-linux-<arch>.tar.gz），都在 dist/ 下
          for f in dist/*; do
            [ -f "$f" ] || continue
            n=$(basename "$f")
            echo "  -> COS: $n"
            zapfile upload zap/releases/ "$f" \
              || { echo "COS upload failed: $n"; exit 1; }
            echo "  -> Cloudflare: $n"
            zapfile upload zap/releases/ "$f" --aws \
              || { echo "Cloudflare upload failed: $n"; exit 1; }
          done
          # latest.txt（内容即版本号，面板/安装器据此判断是否可升级）；必须在包体之后，
          # 避免旧版「latest.txt 先发、包体还没传完」导致的 404 升级 race
          echo "  -> latest.txt (COS + Cloudflare)"
          zapfile put "zap/releases/latest.txt" "$ver" \
            || { echo "latest.txt COS failed"; exit 1; }
          zapfile put "zap/releases/latest.txt" "$ver" --aws \
            || { echo "latest.txt Cloudflare failed"; exit 1; }
          # 安装脚本（zap/install.sh, zap/uninstall.sh）
          for s in scripts/install.sh scripts/uninstall.sh; do
            [ -f "$s" ] || { echo "missing $s"; exit 1; }
            echo "  -> script COS: $s"
            zapfile upload zap/ "$s" \
              || { echo "script COS failed: $s"; exit 1; }
            echo "  -> script Cloudflare: $s"
            zapfile upload zap/ "$s" --aws \
              || { echo "script Cloudflare failed: $s"; exit 1; }
          done
          echo "mirror sync done for v${ver}"
