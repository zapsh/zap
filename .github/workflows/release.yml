name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  PROJECT_NAME: zap

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Clone builtin appstore repo
        run: |
          mkdir -p data/appstore/repos
          rm -rf data/appstore/repos/appstore
          git clone --depth 1 --branch main https://github.com/zapsh/appstore.git data/appstore/repos/appstore

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (pinned)
        run: cargo install cross --version 0.2.5 --locked

      - name: Resolve version
        id: version
        run: |
          version="$(awk -F'"' '/^\[workspace\.package\]/{f=1} f&&/^version/{print $2; exit}' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "error: failed to parse workspace version from Cargo.toml" >&2
            exit 1
          fi
          tag="${GITHUB_REF#refs/tags/}"
          if [ "$tag" != "$GITHUB_REF" ] && [ "${tag#v}" != "$version" ]; then
            echo "warning: tag ${tag} does not match Cargo.toml version ${version}" >&2
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web frontend
        working-directory: web
        env:
          ZAP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm ci
          npm run build:prod

      - name: Build release binaries
        env:
          RUSTFLAGS: "-A linker_messages"
        run: cross build --release --target ${{ matrix.target }} --locked

     
      - name: Package artifact (build.sh layout)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x scripts/release/package.sh
          bash scripts/release/package.sh package-full "${{ matrix.arch }}" "${{ matrix.target }}" "target/${{ matrix.target }}/release" "${{ github.workspace }}/dist"

      - name: Upload tar.gz
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version
        id: version
        run: |
          version="$(awk -F'"' '/^\[workspace\.package\]/{f=1} f&&/^version/{print $2; exit}' Cargo.toml)"
          [ -n "$version" ] || { echo "error: failed to parse workspace version from Cargo.toml"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist

      # download-artifact 会把每个 matrix 产物放进各自子目录，mv to dist/ 
      - name: Flatten artifacts
        run: |
          find dist -type f -name '*.tar.gz' -exec mv -t dist {} +
          find dist -mindepth 1 -type d -empty -delete

      - name: Generate sha256
        run: |
          chmod +x scripts/release/package.sh
          bash scripts/release/package.sh checksum "dist"

      - name: Sign packages (Ed25519)
        env:
          ZAP_SIGN_KEY: ${{ secrets.ZAP_SIGN_KEY }}
        run: |
          if [ -z "$ZAP_SIGN_KEY" ]; then
            echo "info: ZAP_SIGN_KEY not set; skip package signing (updaters need allow_insecure_update)."
            exit 0
          fi
          keyfile=$(mktemp)
          printf '%s\n' "$ZAP_SIGN_KEY" > "$keyfile"
          chmod 600 "$keyfile"
          openssl pkey -in "$keyfile" -noout -text 2>/dev/null | grep -q "ED25519" \
            || { echo "error: ZAP_SIGN_KEY is not an Ed25519 private key"; rm -f "$keyfile"; exit 1; }
          for pkg in dist/*.tar.gz; do
            openssl pkeyutl -sign -inkey "$keyfile" -rawin -in "$pkg" -out "$pkg.sig.bin" \
              || { echo "error: signing failed: $pkg"; rm -f "$keyfile"; exit 1; }
            od -An -tx1 -v "$pkg.sig.bin" | tr -d ' \n' > "$pkg.sig"
            rm -f "$pkg.sig.bin"
            echo "signed: $pkg.sig"
          done
          rm -f "$keyfile"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
