[package]
name = "zapexec"
version.workspace = true
license.workspace = true
edition = "2024"

[dependencies]
zap-proto = { path = "../zap-proto" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
chrono = "0.4"
serde_yaml = "0.9"
zip = "2"
# 插件包解包：支持 tar.gz / tgz / tar.bz2
tar = "0.4"
flate2 = "1.0"
zap-crypto = { path = "../zap-crypto" }
# 插件签名校验：HMAC-SHA256(zap-crypto 主密钥, 文件摘要)
hmac = "0.12"
sha2 = "0.10"
bollard = "0.21.1"
futures-util = "0.3"
base64 = "0.22"
mlua = { version = "0.9", features = ["lua54", "vendored"] }
